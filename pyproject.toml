[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-bot"
version = "2.0.1"
description = "Telegram bot: text → vertical video with TTS and subtitles"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "deep-translator>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "script*", "storage*", "subtitles*", "utils*", "video*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"